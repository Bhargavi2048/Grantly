name: CI Quality Assurance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Check (TypeScript Strict)
        run: npm run typecheck

      - name: Code Hygiene & Linting (ESLint)
        run: npm run lint

      - name: Execute Automated Unit Tests
        run: npm test

      - name: Production Bundle Build (Vite)
        run: npm run build
